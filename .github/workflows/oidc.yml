name: hc255 oidc custom property identity canary
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  token:
    runs-on: ubuntu-latest
    steps:
      - name: print only planted property claim
        shell: bash
        env:
          CLAIM_NAME: repo_property_hc255_oidc_88660716
        run: |
          set -euo pipefail
          response=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hc255-identity-test")
          token=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")
          TOKEN="$token" python3 - <<'PY'
          import os,json,base64
          p=os.environ['TOKEN'].split('.')[1]; p += '='*(-len(p)%4)
          claims=json.loads(base64.urlsafe_b64decode(p))
          k=os.environ['CLAIM_NAME']; v=claims.get(k)
          print('HC255_CLAIM_NAME='+k)
          print('HC255_CLAIM_PRESENT='+str(k in claims).lower())
          print('HC255_CLAIM_VALUE='+str(v))
          assert v == 'trusted', (k,v,sorted(claims))
          PY
